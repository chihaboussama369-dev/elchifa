<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عيادة الشفاء">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>عيادة الشفاء — نظام إدارة العيادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --em-50:#ecfdf5;--em-100:#d1fae5;--em-200:#a7f3d0;--em-400:#34d399;--em-500:#10b981;--em-600:#059669;--em-700:#047857;--em-800:#065f46;
  --sl-50:#f8fafc;--sl-100:#f1f5f9;--sl-200:#e2e8f0;--sl-300:#cbd5e1;--sl-400:#94a3b8;--sl-500:#64748b;--sl-600:#475569;--sl-700:#334155;--sl-800:#1e293b;--sl-900:#0f172a;--sl-950:#0a1120;
  --red:#b91c1c;--red-bg:#fee2e2;--amber:#b45309;--amber-bg:#fef3c7;--blue:#1d4ed8;--blue-bg:#dbeafe;
  --font:'IBM Plex Sans Arabic','Tajawal','Segoe UI',Tahoma,sans-serif;
  --brand:'Aref Ruqaa','IBM Plex Sans Arabic',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--sl-100);color:var(--sl-800);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--em-700);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--sl-500);font-size:13px}
.neg{color:var(--red)}
:focus-visible{outline:3px solid var(--em-400);outline-offset:2px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:262px;flex-shrink:0;background:var(--sl-900);color:var(--sl-300);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:42px;height:42px;border-radius:50% 50% 50% 8px;background:var(--em-500);color:#fff;display:grid;place-items:center;font-family:var(--brand);font-size:26px;line-height:1;flex-shrink:0;padding-bottom:4px}
.logo.big{width:68px;height:68px;font-size:42px;margin:0 auto 12px}
.brand b{display:block;color:#fff;font-family:var(--brand);font-size:22px;line-height:1.2}
.brand small{color:var(--sl-400);font-size:12px}
.nav{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--sl-300);padding:11px 12px;border-radius:10px;cursor:pointer;text-align:start;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--em-600);color:#fff}
.nav .ic{width:22px;text-align:center;font-size:17px}
.nav .bd{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:12px;min-width:22px;text-align:center;padding:0 6px;font-weight:700}
.nav .bd.soft{background:var(--em-500)}
.me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--sl-700);display:grid;place-items:center;color:#fff;font-weight:700}
.me div{flex:1;min-width:0}
.me b{display:block;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--sl-400);font-size:12px}
.me button{background:none;border:1px solid var(--sl-700);color:var(--sl-300);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.me button:hover{border-color:var(--em-500);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:#fff;border-bottom:1px solid var(--sl-200);position:sticky;top:0;z-index:20}
.top h1{font-size:20px;font-weight:700;color:var(--sl-900)}
.top .date{margin-inline-start:auto;color:var(--sl-500);font-size:14px}
.burger{display:none;background:var(--sl-900);color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
.content{padding:26px 28px 60px;max-width:1280px;width:100%}
.scrim{display:none}
.warn-bar{background:var(--amber-bg);color:var(--amber);padding:8px 28px;font-size:14px}

/* generic */
.card{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:20px;margin-bottom:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:17px;font-weight:700;color:var(--sl-900);flex:1}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--sl-300);background:#fff;color:var(--sl-700);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sl-50);border-color:var(--sl-400)}
.btn-primary{background:var(--em-600);border-color:var(--em-600);color:#fff}
.btn-primary:hover{background:var(--em-700);border-color:var(--em-700)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--red);border-color:#fecaca}
.btn-danger:hover{background:var(--red-bg);border-color:#fca5a5}
.btn-wa{background:#16a34a;border-color:#16a34a;color:#fff}
.btn-wa:hover{background:#15803d;border-color:#15803d}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-block{width:100%;padding:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sl-600);margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--sl-300);border-radius:10px;padding:9px 12px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--em-500);outline:3px solid var(--em-100)}
input.mini{width:96px;padding:5px 8px;min-height:34px;text-align:center}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--em-600)}
.inline-check{display:flex;align-items:center;gap:8px;font-size:14px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-bottom:6px}
.badge{display:inline-block;border-radius:99px;font-size:12px;padding:1px 10px;font-weight:600;white-space:nowrap}
.badge.green{background:var(--em-100);color:var(--em-800)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.gray{background:var(--sl-200);color:var(--sl-600)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-weight:600;color:var(--sl-500);font-size:13px;padding:9px 10px;border-bottom:2px solid var(--sl-200);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--sl-100);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.acts{white-space:nowrap;text-align:end}
td.acts .btn{margin-inline-start:4px}
.empty{text-align:center;color:var(--sl-500);padding:30px 10px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:var(--sl-200);color:var(--sl-600);padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--sl-900);color:#fff}
.bar-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar-tools input,.bar-tools select{width:auto;min-width:180px}

/* stats */
.stat{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,.06);border-inline-start:5px solid var(--sl-300)}
.stat small{display:block;color:var(--sl-500);font-size:13px}
.stat b{font-size:24px;color:var(--sl-900);font-weight:700}
.stat.em{border-color:var(--em-500)}
.stat.sl{border-color:var(--sl-800)}
.stat.am{border-color:#f59e0b}
.stat.rd{border-color:#ef4444}
.stat.dark{background:var(--sl-900);border-color:var(--em-400)}
.stat.dark small{color:var(--sl-400)}
.stat.dark b{color:#fff}

/* chart */
.bars{display:flex;gap:10px;align-items:flex-end;height:190px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-wrap{height:130px;width:100%;display:flex;align-items:flex-end}
.bar{width:100%;background:var(--em-500);border-radius:6px 6px 0 0;min-height:3px}
.bar.today{background:var(--sl-900)}
.bar-val{font-size:12px;color:var(--sl-500);height:18px}
.bar-lbl{font-size:12px;color:var(--sl-600)}

/* reception */
.reg-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.svc{display:flex;align-items:center;gap:10px;border:1.5px solid var(--sl-200);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff;flex-wrap:wrap}
.svc:hover{border-color:var(--em-400)}
.svc.sel{border-color:var(--em-600);background:var(--em-50)}
.svc .nm{flex:1;min-width:110px}
.svc .nm b{display:block;font-size:14px}
.svc .nm span{font-size:12px;color:var(--sl-500)}
.prod{display:flex;align-items:center;gap:10px;border:1.5px solid var(--sl-200);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prod.sel{border-color:var(--em-600);background:var(--em-50)}
.prod .nm{flex:1}
.prod .nm b{display:block;font-size:14px}
.prod .nm span{font-size:12px;color:var(--sl-500)}
.custom-row{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;margin:12px 0 0}
.custom-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--sl-300)}
.sum-line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--sl-200);font-size:14px}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;font-weight:700}
.sum-total b{font-size:26px;color:var(--em-700)}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}

/* queue ticket */
.q-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.q-card{display:flex;background:#fff;border-radius:6px 16px 16px 6px;box-shadow:0 1px 2px rgba(15,23,42,.08);overflow:hidden;min-height:116px}
.q-no{width:70px;flex-shrink:0;background:var(--sl-900);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;position:relative}
.q-no::after{content:"";position:absolute;inset-inline-end:-1px;top:8px;bottom:8px;border-inline-end:2px dashed var(--sl-400)}
.q-card.done .q-no{background:var(--em-700)}
.q-card.canc .q-no{background:var(--sl-400)}
.q-card.done,.q-card.canc{opacity:.78}
.q-body{flex:1;padding:12px 16px;min-width:0}
.q-name{font-weight:700;font-size:16px;color:var(--sl-900);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-meta{font-size:13px;color:var(--sl-500);margin:2px 0 6px}
.q-svc{display:flex;flex-wrap:wrap;gap:5px}
.q-svc span{background:var(--em-50);color:var(--em-800);border-radius:6px;padding:1px 9px;font-size:13px}
.q-acts{display:flex;flex-direction:column;gap:6px;padding:10px;justify-content:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sl-500)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--em-500);display:inline-block}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--sl-200)}
.modal-h h3{flex:1;font-size:17px}
.modal-h .x{border:0;background:var(--sl-100);width:34px;height:34px;border-radius:50%;cursor:pointer}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;margin-top:16px}
.modal-f .btn-primary{flex:1}
#toast-root{position:fixed;bottom:20px;inset-inline-start:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--sl-900);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;border-inline-start:5px solid var(--em-400);animation:tin .2s ease-out}
.toast.err{border-color:#f87171}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* receipt */
.receipt{border:1px dashed var(--sl-400);border-radius:12px;padding:18px;background:#fff}
.r-head{text-align:center;margin-bottom:12px}
.r-head .logo{margin:0 auto 6px}
.r-head h2{font-family:var(--brand);font-size:26px;color:var(--sl-900)}
.r-meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px;padding:10px 0;border-block:1px dashed var(--sl-300);margin-bottom:10px}
.r-tbl td,.r-tbl th{padding:6px 4px}
.r-total{display:flex;justify-content:space-between;font-size:18px;padding-top:10px;border-top:2px solid var(--sl-800);margin-top:6px}
.r-foot{text-align:center;color:var(--sl-500);font-size:13px;margin-top:14px}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--sl-900)}
.login-card{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:400px}
.login-card h1{font-family:var(--brand);font-size:34px;text-align:center;color:var(--sl-900);line-height:1.3}
.login-card .muted{text-align:center;margin-bottom:22px}
.hint{margin-top:16px;font-size:13px;color:var(--sl-500);background:var(--sl-100);border-radius:8px;padding:8px 12px}

details{border:1px solid var(--sl-200);border-radius:10px;padding:8px 12px;margin-top:8px}
details summary{cursor:pointer;font-weight:600;color:var(--sl-700)}
.week-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.week-nav .rng{font-weight:700;padding:0 8px}
.week-nav input{width:auto}

@media (max-width:1000px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .reg-grid{grid-template-columns:1fr}
  .sticky{position:static}
}
@media (max-width:900px){
  .burger{display:block}
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;transform:translateX(100%);transition:transform .22s}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:30}
  .top{padding:12px 16px}
  .content{padding:18px 14px 60px}
  .top .date{display:none}
  .g3,.g2,.row3,.row2{grid-template-columns:1fr}
  .q-list{grid-template-columns:1fr}
}
@media (max-width:520px){
  .g4{grid-template-columns:1fr 1fr}
  .stat b{font-size:20px}
  .custom-row{grid-template-columns:1fr 100px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  .side,.top,.no-print,.scrim,#toast-root,.warn-bar{display:none!important}
  .content{padding:0}
  .card{box-shadow:none;border:1px solid #ddd}
  body.print-receipt .main>*:not(.content){display:none}
  body.print-receipt .content{display:none}
  body.print-receipt #modal-root .modal-bg{position:static;background:none;padding:0}
  body.print-receipt #modal-root .modal{box-shadow:none;max-width:none}
  body.print-receipt .modal-h,body.print-receipt .modal-f{display:none}
}

/* ===== Official logo theme: medical green & white (overrides only) ===== */
:root{
  --em-50:#f2f9ec;--em-100:#e1f1d4;--em-200:#c6e6a9;--em-400:#8fcb5e;--em-500:#72b83f;--em-600:#238037;--em-700:#1b6a2c;--em-800:#14532d;
}
img.brand-logo,img.top-logo,img.login-logo,img.r-logo,img.hero-logo{display:block;max-width:100%;height:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;image-rendering:auto;background:#fff}
.side{background:#fff;color:var(--sl-600);border-inline-end:1px solid var(--em-100)}
.brand{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:20px 16px 14px;border-bottom:1px solid var(--em-100)}
.brand img.brand-logo{width:128px;height:128px}
.brand b{color:var(--em-800);font-size:21px}
.brand small{color:var(--sl-500)}
.nav button{color:var(--sl-700)}
.nav button:hover{background:var(--em-50)}
.nav button.on{background:var(--em-600);color:#fff}
.me{border-top:1px solid var(--em-100)}
.me .av{background:var(--em-100);color:var(--em-800)}
.me b{color:var(--sl-900)}
.me small{color:var(--sl-500)}
.me button{border-color:var(--sl-300);color:var(--sl-600)}
.me button:hover{border-color:var(--em-600);color:var(--em-700)}
.top{border-bottom:2px solid var(--em-500);padding-top:calc(12px + env(safe-area-inset-top))}
.top img.top-logo{width:46px;height:46px;flex-shrink:0}
.top h1{color:var(--em-800)}
.burger{background:var(--em-600)}
.hero{display:flex;align-items:center;gap:18px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06);border-inline-start:6px solid var(--em-500);padding:12px 20px;margin-bottom:18px}
.hero img.hero-logo{width:96px;height:96px;flex-shrink:0}
.hero h2{font-family:var(--brand);font-size:30px;color:var(--em-800);line-height:1.3}
.hero p{color:var(--sl-500);font-size:14px}
.stat.dark{background:var(--em-800);border-color:var(--em-400)}
.stat.dark small{color:var(--em-200)}
.q-no{background:var(--em-800)}
.q-card.done .q-no{background:var(--em-500)}
.bar.today{background:var(--em-800)}
.tabs button.on{background:var(--em-800)}
.toast{background:var(--em-800)}
.login-wrap{background:var(--em-50)}
.login-card{box-shadow:0 10px 40px rgba(20,83,45,.12);border:1px solid var(--em-100)}
.login-card img.login-logo{width:200px;height:200px;margin:-6px auto 0}
.login-card h1{color:var(--em-800)}
.r-head img.r-logo{width:110px;height:110px;margin:0 auto 2px}
.r-head h2{color:var(--em-800)}
@media (max-width:900px){
  .side{box-shadow:-8px 0 30px rgba(15,23,42,.2)}
  .top{gap:10px}
  .top h1{font-size:17px}
  .hero{padding:10px 14px;gap:12px}
  .hero img.hero-logo{width:72px;height:72px}
  .hero h2{font-size:24px}
}
@supports(padding:max(0px)){
  .content{padding-bottom:max(60px,env(safe-area-inset-bottom))}
}

/* ===== cloud version additions ===== */
body.busy{cursor:progress}
body.busy .btn,body.busy button{pointer-events:none}
body.busy .btn-primary{opacity:.65}
.steps{padding-inline-start:22px;line-height:2;margin-bottom:6px}
@media (max-width:900px){input,select,textarea{font-size:16px}}
</style>
</head>

const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>Math.round(n).toLocaleString('en-US')+' دج';
const fmtPct=p=>(Math.round(p*100)/100)+'%';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>dstr(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const LOC='ar-DZ-u-nu-latn';
function fmtDate(s,o){try{return parseD(s).toLocaleDateString(LOC,o||{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function fmtDT(ts){try{return new Date(ts).toLocaleString(LOC,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return new Date(ts).toISOString()}}
function weekStart(s){const d=parseD(s);const diff=(d.getDay()-db.settings.weekStart+7)%7;d.setDate(d.getDate()-diff);return dstr(d)}

/* ============ Data (local cache of the cloud database) ============ */
const DEFAULT_SETTINGS={clinicName:'عيادة الشفاء',subtitle:'للطب الصيني والعلاج الطبيعي',phone:'',address:'',countryCode:'213',weekStart:6};
const emptyDb=()=>({users:[],services:[],consumables:[],products:[],visits:[],appointments:[],logs:[],expenses:[],payouts:{},settings:Object.assign({},DEFAULT_SETTINGS)});
let db=emptyDb();
const session={profile:null};
let busy=false,modalOpen=false,pendingConfirm=null,chan=null,liveTimer=null;
const ui={view:null,weekRef:todayStr(),invTab:'consumables',invLog:'',histQ:'',histDate:'',apTab:'up',prefill:null};
const me=()=>session.profile&&session.profile.active?session.profile:null;
const isAdmin=()=>!!session.profile&&session.profile.role==='admin';
const svcById=id=>db.services.find(s=>s.id===id);
const userById=id=>db.users.find(u=>u.id===id);

const must=async q=>{const r=await q;if(r.error)throw r.error;return r.data};
async function fetchAll(build){
  const out=[],step=1000;let from=0;
  for(;;){
    const data=await must(build().range(from,from+step-1));
    out.push(...(data||[]));
    if(!data||data.length<step)break;
    from+=step;
  }
  return out;
}
const mapProfile=r=>({id:r.id,name:r.name,username:r.username,role:r.role,active:r.active,split:Number(r.split)});
const mapService=r=>({id:r.id,name:r.name,type:r.type,price:Number(r.price),min:r.min_price==null?undefined:Number(r.min_price),max:r.max_price==null?undefined:Number(r.max_price),active:r.active,cons:r.cons||[],sort:r.sort});
const mapVisit=r=>({id:r.id,no:r.no,date:r.visit_date,createdAt:new Date(r.created_at).getTime(),firstName:r.first_name,lastName:r.last_name,phone:r.phone,workerId:r.worker_id,workerName:r.worker_name||'',splitPct:Number(r.split_pct),items:r.items||[],total:Number(r.total),serviceTotal:Number(r.service_total),productTotal:Number(r.product_total),status:r.status,doneDate:r.done_date,completedAt:r.completed_at?new Date(r.completed_at).getTime():null,deductions:r.deductions||[]});
const mapAppt=r=>({id:r.id,at:new Date(r.appt_at).getTime(),firstName:r.first_name,lastName:r.last_name,phone:r.phone,workerId:r.worker_id,service:r.service_note||'',notes:r.notes||'',status:r.status,visitId:r.visit_id});
const mapLog=r=>({id:r.id,ts:new Date(r.ts).getTime(),kind:r.kind,itemId:r.item_id,itemName:r.item_name,type:r.type,qty:Number(r.qty),balance:Number(r.balance),dest:r.dest||'',by:r.by_name||''});

/* scope: 'all' (everything) or 'live' (only the tables that change during the day) */
async function loadAll(scope){
  const live=scope==='live',admin=isAdmin(),next=Object.assign({},db),jobs=[];
  const put=(k,p,fn)=>jobs.push(p.then(v=>{next[k]=fn?fn(v):v}));
  put('visits',fetchAll(()=>sb.from('visits').select('*').order('created_at').order('id')),rs=>rs.map(mapVisit));
  put('appointments',fetchAll(()=>sb.from('appointments').select('*').order('appt_at').order('id')),rs=>rs.map(mapAppt));
  if(!live){
    put('services',fetchAll(()=>sb.from('services').select('*').order('sort').order('id')),rs=>rs.map(mapService));
    put('settings',must(sb.from('settings').select('data').eq('id',1).maybeSingle()),r=>Object.assign({},DEFAULT_SETTINGS,(r&&r.data)||{}));
  }
  if(admin){
    put('consumables',must(sb.from('consumables').select('*').order('name')),rs=>rs.map(r=>({id:r.id,name:r.name,unit:r.unit,stock:Number(r.stock)})));
    put('products',must(sb.from('products').select('*').order('name')),rs=>rs.map(r=>({id:r.id,name:r.name,price:Number(r.price),stock:Number(r.stock)})));
    put('logs',must(sb.from('stock_logs').select('*').order('ts',{ascending:false}).limit(500)),rs=>rs.map(mapLog));
    if(!live){
      put('users',must(sb.from('profiles').select('*').order('role').order('name')),rs=>rs.map(mapProfile));
      put('expenses',must(sb.from('expenses').select('*').order('exp_date',{ascending:false}).limit(2000)),rs=>rs.map(r=>({id:r.id,date:r.exp_date,label:r.label,amount:Number(r.amount)})));
      put('payouts',must(sb.from('payouts').select('*')),rs=>{const o={};rs.forEach(r=>{o[r.week_start+'_'+r.worker_id]=new Date(r.paid_at).getTime()});return o});
    }
  }
  await Promise.all(jobs);
  if(!admin&&!live)next.users=[session.profile];
  db=next;
}

/* ---- auth ---- */
const userEmail=u=>{u=String(u||'').trim().toLowerCase();return u.indexOf('@')>=0?u:u+'@'+EMAIL_DOMAIN};
async function startSession(authUser){
  const prof=await must(sb.from('profiles').select('*').eq('id',authUser.id).maybeSingle());
  if(!prof||!prof.active){await sb.auth.signOut();return 'inactive'}
  session.profile=mapProfile(prof);
  await loadAll('all');
  subscribeLive();
  return 'ok';
}
function clearSession(){
  unsubscribeLive();session.profile=null;db=emptyDb();ui.view=null;ui.prefill=null;
  if(typeof closeModal==='function')closeModal();
}
async function doLogout(){
  try{await sb.auth.signOut()}catch(e){}
  clearSession();render();
}

/* ---- realtime: visits + appointments, with polling/visibility fallbacks (phones suspend sockets) ---- */
function subscribeLive(){
  unsubscribeLive();
  if(!sb||!sb.channel)return;
  try{
    chan=sb.channel('clinic-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'visits'},scheduleLive)
      .on('postgres_changes',{event:'*',schema:'public',table:'appointments'},scheduleLive)
      .subscribe();
  }catch(e){chan=null}
}
function unsubscribeLive(){if(chan){try{sb.removeChannel(chan)}catch(e){}chan=null}}
function scheduleLive(){clearTimeout(liveTimer);liveTimer=setTimeout(refreshLive,500)}
async function refreshLive(){
  if(!session.profile||busy||!sb)return;
  try{
    const prof=await must(sb.from('profiles').select('*').eq('id',session.profile.id).maybeSingle());
    if(!prof||!prof.active){await sb.auth.signOut();clearSession();render();return}
    session.profile=mapProfile(prof);
    await loadAll('live');
  }catch(e){return}
  if(modalOpen||isEditing())return;
  if(LIVE.indexOf(ui.view)>=0)render();
}

/* ============ Business logic ============ */
function shares(v){
  const worker=v.workerId?Math.round(v.serviceTotal*v.splitPct/100):0;
  return {worker,clinicSvc:v.serviceTotal-worker};
}
function agg(from,to,workerId){
  const vs=db.visits.filter(v=>v.status==='completed'&&v.doneDate>=from&&v.doneDate<=to&&(!workerId||v.workerId===workerId));
  let rev=0,svc=0,prod=0,work=0;
  vs.forEach(v=>{rev+=v.total;svc+=v.serviceTotal;prod+=v.productTotal;work+=shares(v).worker});
  const exp=workerId?0:db.expenses.filter(e=>e.date>=from&&e.date<=to).reduce((a,e)=>a+e.amount,0);
  return {vs,rev,svc,prod,work,clinicSvc:svc-work,exp,net:svc-work+prod-exp,count:vs.length};
}
const itemsText=v=>v.items.map(i=>i.qty>1?`${i.name} × ${i.qty}`:i.name);

function customRowHtml(){return `<div class="custom-row"><input class="cname" placeholder="اسم الخدمة"><input class="cprice" type="number" min="0" step="100" placeholder="السعر دج"><button type="button" class="btn btn-danger btn-sm" data-act="rmCustom" aria-label="حذف">✕</button></div>`}
function readReg(){
  const f=$('#regForm');if(!f)return null;
  const q=n=>f.querySelector(`[name="${n}"]`);
  const items=[];
  db.services.filter(s=>s.active).forEach(s=>{
    const cb=f.querySelector(`input[name="svc"][value="${s.id}"]`);if(!cb||!cb.checked)return;
    let price=s.price,qty=1;
    if(s.type==='range')price=num(q('price_'+s.id).value);
    if(s.type==='person')qty=Math.max(1,parseInt(q('qty_'+s.id).value)||1);
    items.push({kind:'service',refId:s.id,name:s.name,unitPrice:price,qty,line:price*qty});
  });
  $$('.custom-row',f).forEach(r=>{
    const n=$('.cname',r).value.trim(),p=num($('.cprice',r).value);
    if(n)items.push({kind:'custom',refId:null,name:n,unitPrice:p,qty:1,line:p});
  });
  db.products.forEach(p=>{
    const el=q('prod_'+p.id);if(!el)return;const n=Math.floor(num(el.value));
    if(n>0)items.push({kind:'product',refId:p.id,name:p.name,unitPrice:p.price,qty:n,line:p.price*n});
  });
  const serviceTotal=items.filter(i=>i.kind!=='product').reduce((a,i)=>a+i.line,0);
  const productTotal=items.filter(i=>i.kind==='product').reduce((a,i)=>a+i.line,0);
  return {first:q('first').value.trim(),last:q('last').value.trim(),phone:q('phone').value.trim(),workerId:q('worker').value,statusSel:q('statusSel').value,items,serviceTotal,productTotal,total:serviceTotal+productTotal};
}
function updateRegSummary(){
  const f=$('#regForm'),box=$('#regSummary');if(!f||!box)return;
  const r=readReg();
  $$('.svc',f).forEach(l=>l.classList.toggle('sel',l.querySelector('input[type=checkbox]').checked));
  $$('.prod',f).forEach(l=>l.classList.toggle('sel',num(l.querySelector('input').value)>0));
  const need={};
  r.items.forEach(i=>{if(i.kind==='service'){const s=svcById(i.refId);if(s)(s.cons||[]).forEach(c=>need[c.id]=(need[c.id]||0)+c.qty*i.qty)}});
  const short=Object.keys(need).map(id=>db.consumables.find(c=>c.id===id)).filter(c=>c&&c.stock<need[c.id]).map(c=>`${c.name} (المتوفر ${c.stock}، المطلوب ${need[c.id]})`);
  const hasSvc=r.items.some(i=>i.kind!=='product');
  const st=r.statusSel==='auto'?(hasSvc?'queue':'completed'):r.statusSel;
  box.innerHTML=`<div class="card-h" style="margin-bottom:6px"><h3>ملخص الفاتورة</h3></div>
    ${r.items.length?r.items.map(i=>`<div class="sum-line"><span>${esc(i.name)}${i.qty>1?' × '+i.qty:''}</span><b>${fmt(i.line)}</b></div>`).join(''):'<div class="empty" style="padding:14px 0">اختر خدمة أو منتجاً</div>'}

    ${short.length?`<div class="warn">⚠ المخزون غير كافٍ: ${short.map(esc).join('، ')}</div>`:''}`;
}

function queueList(list,admin){

  <p class="muted" style="margin-bottom:12px">«خدمة حرة» بالاسم والسعر متاحة دائماً في صفحة الاستقبال. المستهلكات المرتبطة تُخصم تلقائياً من المخزن عند التسجيل.</p>
  <div class="tbl-wrap"><table><thead><tr><th>الخدمة</th><th>السعر</th><th>النوع</th><th>المستهلكات المخصومة</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${db.services.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${svcPriceText(s)}</td><td>${TYPE_LBL[s.type]}</td>
   <td>${(s.cons||[]).map(c=>{const it=db.consumables.find(x=>x.id===c.id);return it?`<span class="badge gray">${esc(it.name)} × ${c.qty}</span> `:''}).join('')||'<span class="muted">—</span>'}</td>
   <td>${s.active?badge('مفعّلة','green'):badge('متوقفة','gray')}</td>
   <td class="acts"><button class="btn btn-sm" data-act="svcForm" data-id="${s.id}">تعديل</button><button class="btn btn-sm" data-act="toggleSvc" data-id="${s.id}">${s.active?'إيقاف':'تفعيل'}</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
};
function consRowHtml(selId,qty){
  return `<div class="custom-row cons-row" style="grid-template-columns:1fr 90px 40px"><select class="cid">${db.consumables.map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input class="cqty" type="number" min="1" value="${qty||1}"><button type="button" class="btn btn-danger btn-sm" data-act="rmRow" aria-label="حذف">✕</button></div>`;
}
function openSvcForm(id){
  const s=id?svcById(id):{type:'fixed',price:1500,min:1000,max:6000,cons:[],active:true,name:''};
  openModal(id?'تعديل الخدمة':'خدمة جديدة',`<form data-form="service"><input type="hidden" name="id" value="${id||''}">
   <div class="field"><label>اسم الخدمة</label><input name="name" value="${esc(s.name)}" required></div>
   <div class="row2"><div class="field"><label>نوع السعر</label><select name="type" data-on="svcType">${Object.keys(TYPE_LBL).map(k=>`<option value="${k}" ${k===s.type?'selected':''}>${TYPE_LBL[k]}</option>`).join('')}</select></div>
   <div class="field"><label>السعر (دج) <span class="muted" id="priceHint">${s.type==='range'?'الافتراضي':''}</span></label><input name="price" type="number" min="0" step="100" value="${s.price}" required></div></div>
   <div class="row2 ${s.type==='range'?'':'hidden'}" id="rangeBox"><div class="field"><label>أدنى سعر</label><input name="min" type="number" min="0" step="100" value="${s.min||1000}"></div><div class="field"><label>أعلى سعر</label><input name="max" type="number" min="0" step="100" value="${s.max||6000}"></div></div>
   <div class="field"><label>المستهلكات المخصومة لكل مرة</label><div id="consRows">${(s.cons||[]).map(c=>consRowHtml(c.id,c.qty)).join('')}</div>
   <button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px" data-act="addConsRow">+ إضافة مستهلك</button></div>
   <label class="inline-check"><input type="checkbox" name="active" ${s.active?'checked':''}> الخدمة مفعّلة</label>
   <div class="modal-f"><button class="btn btn-primary">حفظ</button><button type="button" class="btn btn-ghost" data-act="closeModal">إلغاء</button></div></form>`,true);
}

/* ---- Inventory ---- */
function stockBadge(n){return n<=0?badge('نفد','red'):n<LOW?badge('مخزون منخفض','red'):badge('متوفر','green')}
function invTable(kind){
  const isP=kind==='product',list=isP?db.products:db.consumables;
  return `<div class="card"><div class="card-h"><h3>${isP?'منتجات للبيع المباشر':'المستهلكات والمعدات'}</h3><button class="btn btn-primary" data-act="itemForm" data-kind="${kind}">+ إضافة صنف</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>الصنف</th><th>${isP?'السعر':'الوحدة'}</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${list.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${isP?fmt(i.price):esc(i.unit)}</td><td><b class="${i.stock<LOW?'neg':''}">${i.stock}</b></td><td>${stockBadge(i.stock)}</td>
  <td class="acts"><button class="btn btn-sm" data-act="moveForm" data-kind="${kind}" data-id="${i.id}" data-type="in">+ إدخال</button><button class="btn btn-sm" data-act="moveForm" data-kind="${kind}" data-id="${i.id}" data-type="out">− صرف</button><button class="btn btn-sm" data-act="itemForm" data-kind="${kind}" data-id="${i.id}">تعديل</button><button class="btn btn-sm btn-danger" data-act="delItem" data-kind="${kind}" data-id="${i.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد أصناف</td></tr>'}
  </tbody></table></div></div>`;
}
views.inventory=function(){
  const tabs=[['consumables','المستهلكات والمعدات'],['products','المنتجات للبيع'],['log','سجل الحركة']];
  let body;
  if(ui.invTab==='consumables')body=invTable('consumable');
  else if(ui.invTab==='products')body=invTable('product');
  else{
    const all=[...db.consumables,...db.products];
    const logs=db.logs.filter(l=>!ui.invLog||l.itemId===ui.invLog).slice(0,300);
    body=`<div class="card"><div class="bar-tools"><select data-on="invLog"><option value="">كل الأصناف</option>${all.map(i=>`<option value="${i.id}" ${ui.invLog===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div>
    <div class="tbl-wrap"><table><thead><tr><th>الوقت</th><th>الصنف</th><th>الحركة</th><th>الكمية</th><th>الرصيد</th><th>الوجهة / الملاحظة</th><th>بواسطة</th></tr></thead><tbody>
    ${logs.map(l=>`<tr><td>${fmtDT(l.ts)}</td><td>${esc(l.itemName)}</td><td>${l.type==='out'?badge('خروج','red'):l.type==='in'?badge('دخول','green'):badge('تعديل','blue')}</td><td>${l.qty}</td><td>${l.balance}</td><td>${esc(l.dest)}</td><td>${esc(l.by)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد حركات بعد</td></tr>'}
    </tbody></table></div></div>`;
  }
  const low=lowItems();
  return `${low.length?`<div class="warn" style="margin:0 0 14px">⚠ مخزون منخفض (أقل من ${LOW}): ${low.map(i=>esc(i.name)+' ('+i.stock+')').join('، ')}</div>`:''}
  <div class="tabs">${tabs.map(t=>`<button class="${ui.invTab===t[0]?'on':''}" data-act="invTab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
};

/* ---- Staff ---- */

/* ---- Payroll ---- */
function weekNav(){
  const ws=weekStart(ui.weekRef),we=addDays(ws,6);
  return `<div class="week-nav no-print"><button class="btn btn-sm" data-act="weekNext">← الأسبوع التالي</button><span class="rng">${fmtDate(ws,{day:'numeric',month:'short'})} — ${fmtDate(we,{day:'numeric',month:'short',year:'numeric'})}</span><button class="btn btn-sm" data-act="weekPrev">الأسبوع السابق →</button><button class="btn btn-sm" data-act="weekThis">هذا الأسبوع</button><input type="date" data-on="weekDate" value="${ui.weekRef}"></div>`;
}
views.payroll=function(){
  const ws=weekStart(ui.weekRef),we=addDays(ws,6),a=agg(ws,we);
  const rows=db.users.filter(u=>u.role==='worker').map(u=>{
    const vs=a.vs.filter(v=>v.workerId===u.id);let svc=0,pay=0;
    vs.forEach(v=>{svc+=v.serviceTotal;pay+=shares(v).worker});
    return {u,vs,svc,pay,clinic:svc-pay,key:ws+'_'+u.id};
  }).filter(r=>r.u.active||r.vs.length);
  const exps=db.expenses.filter(e=>e.date>=ws&&e.date<=we).sort((x,y)=>y.date.localeCompare(x.date));
  return `${weekNav()}
  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat sl"><small>إجمالي الإيرادات</small><b>${fmt(a.rev)}</b></div>
    <div class="stat am"><small>مستحقات العمال</small><b>${fmt(a.work)}</b></div>
    <div class="stat em"><small>حصة العيادة (خدمات) + مبيعات المنتجات</small><b>${fmt(a.clinicSvc+a.prod)}</b></div>
    <div class="stat dark"><small>صافي الربح بعد المصاريف</small><b>${fmt(a.net)}</b></div>
  </div>
  <div class="card"><div class="card-h"><h3>أجور الممارسين</h3><button class="btn btn-sm no-print" data-act="printPage">🖨 طباعة</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>الممارس</th><th>القاعدة</th><th>عدد الخدمات</th><th>إيراد الخدمات</th><th>أجره</th><th>حصة العيادة</th><th class="no-print">الدفع</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.u.name)}</b></td><td>${ruleLabel(r.u.split)}</td><td>${r.vs.length}</td><td>${fmt(r.svc)}</td><td><b>${fmt(r.pay)}</b></td><td>${fmt(r.clinic)}</td>
   <td class="no-print">${db.payouts[r.key]?`<button class="btn btn-sm" data-act="togglePaid" data-ws="${ws}" data-wid="${r.u.id}">${badge('تم الدفع ✓','green')}</button>`:`<button class="btn btn-sm btn-primary" data-act="togglePaid" data-ws="${ws}" data-wid="${r.u.id}" ${r.pay?'':'disabled'}>تسجيل الدفع</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا يوجد ممارسون</td></tr>'}
  <tr style="background:var(--sl-50)"><td colspan="2"><b>المجموع</b></td><td><b>${a.vs.filter(v=>v.workerId).length}</b></td><td><b>${fmt(a.svc)}</b></td><td><b>${fmt(a.work)}</b></td><td><b>${fmt(a.clinicSvc)}</b></td><td class="no-print"></td></tr>
  </tbody></table></div>
  ${rows.filter(r=>r.vs.length).map(r=>`<details><summary>${esc(r.u.name)} — ${r.vs.length} خدمة</summary><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>المريض</th><th>الخدمات</th><th>الرسوم</th><th>نصيبه</th></tr></thead><tbody>${r.vs.map(v=>`<tr><td>${v.doneDate}</td><td>${esc(v.firstName)} ${esc(v.lastName)}</td><td>${itemsText(v).map(esc).join('، ')}</td><td>${fmt(v.serviceTotal)}</td><td>${fmt(shares(v).worker)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}
  <p class="muted" style="margin-top:12px">نسبة العامل تُحسب على الخدمات فقط، ومبيعات المنتجات تعود كاملة للعيادة.</p></div>
  <div class="card"><div class="card-h"><h3>مصاريف الأسبوع</h3></div>
  <form data-form="expense" class="no-print" style="display:grid;grid-template-columns:1fr 150px 160px auto;gap:10px;margin-bottom:12px"><input name="label" placeholder="البند (كراء، كهرباء، شراء مستلزمات…)" required><input name="amount" type="number" min="1" placeholder="المبلغ دج" required><input name="date" type="date" value="${todayStr()}" required><button class="btn btn-primary">إضافة</button></form>
  <div class="tbl-wrap"><table><tbody>${exps.map(e=>`<tr><td>${e.date}</td><td>${esc(e.label)}</td><td><b>${fmt(e.amount)}</b></td><td class="acts no-print"><button class="btn btn-sm btn-danger" data-act="delExpense" data-id="${e.id}">حذف</button></td></tr>`).join('')||'<tr><td class="empty">لا توجد مصاريف هذا الأسبوع</td></tr>'}</tbody></table></div></div>`;
};

/* ---- Worker earnings ---- */
views.myearnings=function(){
  const u=me(),t=todayStr(),ws=weekStart(ui.weekRef),we=addDays(ws,6);
  const td=agg(t,t,u.id),wk=agg(ws,we,u.id);
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const perDay=days.map(d=>{const a=agg(d,d,u.id);return {d,n:a.count,pay:a.work}}).filter(x=>x.n);
  return `<div class="grid g4" style="margin-bottom:18px">
    <div class="stat dark"><small>أرباحي اليوم</small><b>${fmt(td.work)}</b></div>
    <div class="stat em"><small>خدمات منجزة اليوم</small><b>${td.count}</b></div>
    <div class="stat sl"><small>مستحقاتي هذا الأسبوع</small><b>${fmt(wk.work)}</b></div>
    <div class="stat sl"><small>خدمات الأسبوع</small><b>${wk.count}</b></div></div>
  <div class="card"><div class="card-h"><h3>خدماتي المنجزة اليوم</h3></div>
  <div class="tbl-wrap"><table><thead><tr><th>المريض</th><th>الخدمات</th><th>نصيبي</th></tr></thead><tbody>
  ${td.vs.map(v=>`<tr><td>${esc(v.firstName)} ${esc(v.lastName)}</td><td>${itemsText(v).map(esc).join('، ')}</td><td><b>${fmt(shares(v).worker)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="empty">لم تُنهِ أي خدمة اليوم بعد</td></tr>'}
  </tbody></table></div></div>
  ${weekNav()}
  <div class="card"><div class="card-h"><h3>تفصيل الأسبوع</h3></div>
  <div class="tbl-wrap"><table><thead><tr><th>اليوم</th><th>عدد الخدمات</th><th>أرباحي</th></tr></thead><tbody>
  ${perDay.map(x=>`<tr><td>${fmtDate(x.d,{weekday:'long',day:'numeric',month:'short'})}</td><td>${x.n}</td><td><b>${fmt(x.pay)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد خدمات منجزة في هذا الأسبوع</td></tr>'}
  <tr style="background:var(--sl-50)"><td><b>المجموع</b></td><td><b>${wk.count}</b></td><td><b>${fmt(wk.work)}</b></td></tr></tbody></table></div></div>`;
};

/* ---- Appointments (new) ---- */
const fmtTime=ts=>{try{return new Date(ts).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}};
const dayOf=ts=>dstr(new Date(ts));
function dayLabel(d){
  const t=todayStr(),base=fmtDate(d,{weekday:'long',day:'numeric',month:'long'});
  return d===t?'اليوم — '+base:d===addDays(t,1)?'غداً — '+base:base;
}
function apptCard(a,admin){
  const w=userById(a.workerId);
  const st={scheduled:badge('مجدول','blue'),arrived:badge('حضر','green'),cancelled:badge('ملغى','gray'),missed:badge('لم يحضر','red')}[a.status]||'';
  return `<div class="q-card ${a.status==='arrived'?'done':''} ${(a.status==='cancelled'||a.status==='missed')?'canc':''}">
    <div class="q-no" style="font-size:20px;width:84px">${fmtTime(a.at)}</div>
    <div class="q-body">
      <div class="q-name">${esc(a.firstName)} ${esc(a.lastName)} ${st}</div>
      <div class="q-meta"><a href="tel:${esc(a.phone)}" dir="ltr">📞 ${esc(a.phone)}</a>${admin&&w?' · '+esc(w.name):''}</div>
      ${a.service?`<div class="q-svc"><span>${esc(a.service)}</span></div>`:''}
      ${a.notes?`<div class="muted" style="margin-top:4px">${esc(a.notes)}</div>`:''}
    </div>
    ${admin&&a.status==='scheduled'?`<div class="q-acts">
      <button class="btn btn-primary btn-sm" data-act="apptArrive" data-id="${a.id}">وصل المريض</button>
      <button class="btn btn-sm" data-act="apptForm" data-id="${a.id}">تعديل</button>
      <button class="btn btn-sm btn-danger" data-act="apptStatus" data-id="${a.id}" data-st="cancelled">إلغاء</button>
      <button class="btn btn-sm btn-danger" data-act="apptStatus" data-id="${a.id}" data-st="missed">لم يحضر</button></div>`:''}
  </div>`;
}
function apptList(list,admin,emptyMsg,desc){
  if(!list.length)return `<div class="card empty">${emptyMsg}</div>`;
  const groups={};
  list.forEach(a=>{const d=dayOf(a.at);(groups[d]=groups[d]||[]).push(a)});
  let days=Object.keys(groups).sort();if(desc)days.reverse();
  return days.map(d=>`<h3 style="margin:18px 0 10px;font-size:16px;color:var(--em-800)">${dayLabel(d)}</h3><div class="q-list">${groups[d].sort((x,y)=>x.at-y.at).map(a=>apptCard(a,admin)).join('')}</div>`).join('');
}
views.appointments=function(){
  const start=parseD(todayStr()).getTime();
  const up=db.appointments.filter(a=>a.status==='scheduled'&&a.at>=start);
  const past=db.appointments.filter(a=>!(a.status==='scheduled'&&a.at>=start)).sort((x,y)=>y.at-x.at).slice(0,100);
  const tab=ui.apTab;
  return `<div class="bar-tools"><div class="tabs" style="margin:0"><button class="${tab==='up'?'on':''}" data-act="apTab" data-tab="up">القادمة (${up.length})</button><button class="${tab==='past'?'on':''}" data-act="apTab" data-tab="past">السابقة</button></div>
  <button class="btn btn-primary" style="margin-inline-start:auto" data-act="apptForm">+ موعد جديد</button></div>
  ${tab==='up'?apptList(up,true,'لا توجد مواعيد قادمة. أضف أول موعد.',false):apptList(past,true,'لا توجد مواعيد سابقة.',true)}`;
};
views.myappts=function(){
  const start=parseD(todayStr()).getTime(),u=me();
  const up=db.appointments.filter(a=>a.status==='scheduled'&&a.at>=start&&a.workerId===u.id);
  return `<div class="bar-tools"><span class="live"><i></i> يتحدّث تلقائياً</span></div>${apptList(up,false,'لا توجد مواعيد قادمة لك.',false)}`;
};
function apptCardHtml(){
  const t=todayStr();
  const list=db.appointments.filter(a=>a.status==='scheduled'&&dayOf(a.at)===t).sort((x,y)=>x.at-y.at);
  return `<div class="card"><div class="card-h"><h3>مواعيد اليوم</h3><button class="btn btn-sm" data-act="go" data-view="appointments">كل المواعيد</button></div>
  ${list.length?list.map(a=>{const w=userById(a.workerId);return `<div class="sum-line"><span><b>${fmtTime(a.at)}</b> — ${esc(a.firstName)} ${esc(a.lastName)}</span><span class="muted">${esc(w?w.name:'')}</span></div>`}).join(''):'<div class="empty">لا توجد مواعيد اليوم</div>'}</div>`;
}
function applyPrefill(){
  const p=ui.prefill,f=$('#regForm');if(!p||!f)return;
  const set=(n,v)=>{const el=f.querySelector(`[name="${n}"]`);if(el)el.value=v};
  set('first',p.first);set('last',p.last);set('phone',p.phone);
  if(p.workerId&&f.querySelector(`select[name="worker"] option[value="${p.workerId}"]`))set('worker',p.workerId);
  const n=$('#prefillNote');
  if(n)n.innerHTML=`<div class="warn" style="margin:0 0 14px">📅 من موعد الساعة ${fmtTime(p.at)}${p.service?' — الخدمة المطلوبة: '+esc(p.service):''}. اختر الخدمات ثم سجّل.</div>`;
}

const errMsg=e=>{
  const m=(e&&e.message)||String(e);
  if(/insufficient stock/i.test(m))return 'المخزون غير كافٍ لهذا المنتج';
  if(/not allowed|permission denied|row-level security/i.test(m))return 'ليست لديك صلاحية لهذا الإجراء';
  if(/worker required/i.test(m))return 'اختر الممارس';
  if(/invalid worker/i.test(m))return 'الممارس غير صالح أو موقوف';
  if(/out of range/i.test(m))return 'السعر خارج المجال المسموح';
  if(/visit is not in queue/i.test(m))return 'هذه الزيارة لم تعد في الانتظار';
  if(/already cancelled/i.test(m))return 'الزيارة ملغاة مسبقاً';
  if(/duplicate key/i.test(m))return 'القيمة مكررة';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'لا يوجد اتصال بالإنترنت';
  return m;
};
async function withBusy(fn){
  if(busy)return;
  busy=true;document.body.classList.add('busy');
  try{return await fn()}
  catch(e){toast(errMsg(e),'err')}
  finally{busy=false;document.body.classList.remove('busy')}
}

const forms={
  async login(f){
    const err=$('#loginErr');err.textContent='';
    if(!sb){err.textContent='تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت وأعد تحميل الصفحة.';return}
    await withBusy(async()=>{
      const r=await sb.auth.signInWithPassword({email:userEmail(fv(f,'u')),password:fv(f,'p')});
      if(r.error){
        err.textContent=/invalid/i.test(r.error.message)?'اسم المستخدم أو كلمة المرور غير صحيحة':'تعذّر الدخول: '+errMsg(r.error);
        return;
      }
      let res;
      try{res=await startSession(r.data.user)}catch(e){await sb.auth.signOut();err.textContent='تعذّر تحميل البيانات: '+errMsg(e);return}
      if(res!=='ok'){err.textContent='هذا الحساب موقوف أو غير مهيّأ. راجع المدير.';return}
      ui.view=null;ui.weekRef=todayStr();render();
    });
  },
  async register(){
    const r=readReg(),errs=[];
    if(!r.first)errs.push('أدخل اسم المريض');
    if(!r.last)errs.push('أدخل لقب المريض');
    if(r.phone.replace(/\D/g,'').length<8)errs.push('رقم الهاتف غير صالح');
    if(!r.items.length)errs.push('اختر خدمة أو منتجاً واحداً على الأقل');
    const hasSvc=r.items.some(i=>i.kind!=='product');
    if(hasSvc&&!r.workerId)errs.push('اختر الممارس');
    r.items.forEach(i=>{
      if(i.kind==='service'){const s=svcById(i.refId);if(s&&s.type==='range'&&(i.unitPrice<s.min||i.unitPrice>s.max))errs.push(`سعر ${s.name} يجب أن يكون بين ${s.min} و ${s.max} دج`)}
      if(i.kind==='custom'&&!(i.unitPrice>0))errs.push(`أدخل سعر الخدمة الحرة «${i.name}»`);
      if(i.kind==='product'){const p=db.products.find(x=>x.id===i.refId);if(p&&i.qty>p.stock)errs.push(`المخزون غير كافٍ: ${p.name} (المتوفر ${p.stock})`)}
    });
    if(errs.length){toast(errs[0],'err');return}
    await withBusy(async()=>{
      const payload={first_name:r.first,last_name:r.last,phone:r.phone,worker_id:r.workerId||null,status_sel:r.statusSel,
        items:r.items.map(i=>({kind:i.kind,ref_id:i.refId,qty:i.qty,unit_price:i.unitPrice,name:i.name}))};
      const id=await must(sb.rpc('register_visit',{p:payload}));
      if(ui.prefill&&ui.prefill.apptId){
        await sb.from('appointments').update({status:'arrived',visit_id:id}).eq('id',ui.prefill.apptId);
      }
      ui.prefill=null;
      await loadAll('live');
      const v=db.visits.find(x=>x.id===id);
      toast(v&&v.status==='queue'?'تم تسجيل المريض في الطابور':'تم تسجيل العملية');
      render();showReceipt(id);
    });
  },
  async service(f){
    const id=fv(f,'id'),name=fv(f,'name').trim(),type=fv(f,'type');
    let price=num(fv(f,'price')),min=num(fv(f,'min')),max=num(fv(f,'max'));
    if(!name){toast('أدخل اسم الخدمة','err');return}
    if(type==='range'){if(!(min>0&&max>min)){toast('حدّد حدّاً أدنى وأعلى صحيحين','err');return}price=Math.min(max,Math.max(min,price||min))}
    else if(!(price>0)){toast('أدخل السعر','err');return}
    const cons={};
    $$('.cons-row',f).forEach(r=>{const c=$('.cid',r).value,q=Math.max(1,parseInt($('.cqty',r).value)||1);cons[c]=(cons[c]||0)+q});
    const consArr=Object.keys(cons).map(k=>({id:k,qty:cons[k]}));
    const row={name,type,price,min_price:type==='range'?min:null,max_price:type==='range'?max:null,cons:consArr,active:f.elements.active.checked};
    await withBusy(async()=>{
      if(id)await must(sb.from('services').update(row).eq('id',id));
      else{
        const sort=db.services.reduce((m,s)=>Math.max(m,s.sort||0),0)+1;
        await must(sb.from('services').insert(Object.assign({id:'s_'+uid(),sort},row)));
      }
      closeModal();await loadAll('all');toast('تم حفظ الخدمة');render();
    });
  },
  async staff(f){
    const id=fv(f,'id'),name=fv(f,'name').trim(),u=userById(id);
    if(!u||!name){toast('أدخل الاسم','err');return}
    const patch={name};
    if(u.role==='worker'){
      const split=num(fv(f,'split'));
      if(!(split>=0&&split<=100)){toast('النسبة يجب أن تكون بين 0 و 100','err');return}
      patch.split=split;patch.active=f.elements.active.checked;
    }
    await withBusy(async()=>{
      await must(sb.from('profiles').update(patch).eq('id',id));
      closeModal();await loadAll('all');
      if(id===session.profile.id)session.profile.name=name;
      toast('تم حفظ الحساب');render();
    });
  },
  async item(f){
    const kind=fv(f,'kind'),id=fv(f,'id'),isP=kind==='product',name=fv(f,'name').trim();
    if(!name){toast('أدخل اسم الصنف','err');return}
    const table=isP?'products':'consumables';
    await withBusy(async()=>{
      if(id){
        const patch=isP?{name,price:num(fv(f,'price'))}:{name,unit:fv(f,'unit').trim()||'قطعة'};
        await must(sb.from(table).update(patch).eq('id',id));
      }else{
        const nid=(isP?'p_':'c_')+uid(),stock=Math.max(0,Math.floor(num(fv(f,'stock'))));
        const row=isP?{id:nid,name,price:num(fv(f,'price')),stock:0}:{id:nid,name,unit:fv(f,'unit').trim()||'قطعة',stock:0};
        await must(sb.from(table).insert(row));
        if(stock>0)await must(sb.rpc('stock_move',{p_kind:kind,p_id:nid,p_type:'in',p_qty:stock,p_dest:'رصيد افتتاحي'}));
      }
      closeModal();await loadAll('all');toast('تم الحفظ');render();
    });
  },
  async move(f){
    const kind=fv(f,'kind'),id=fv(f,'id'),type=fv(f,'type'),qty=Math.floor(num(fv(f,'qty'))),dest=fv(f,'dest').trim();
    if(qty<1){toast('أدخل كمية صحيحة','err');return}
    if(type==='out'&&!dest){toast('حدّد وجهة الصرف','err');return}
    await withBusy(async()=>{
      await must(sb.rpc('stock_move',{p_kind:kind,p_id:id,p_type:type,p_qty:qty,p_dest:dest||(type==='in'?'إدخال يدوي':'')}));
      closeModal();await loadAll('live');toast(type==='in'?'تم إدخال الكمية':'تم الصرف');render();
    });
  },
  async expense(f){
    const label=fv(f,'label').trim(),amount=num(fv(f,'amount'));
    if(!label||!(amount>0))return;
    await withBusy(async()=>{
      await must(sb.from('expenses').insert({exp_date:fv(f,'date')||todayStr(),label,amount}));
      await loadAll('all');render();
    });
  },
  async settings(f){
    const s=Object.assign({},db.settings,{
      clinicName:fv(f,'clinicName').trim()||db.settings.clinicName,subtitle:fv(f,'subtitle').trim(),phone:fv(f,'phone').trim(),
      address:fv(f,'address').trim(),countryCode:fv(f,'countryCode').replace(/\D/g,'')||'213',weekStart:parseInt(fv(f,'weekStart'))});
    await withBusy(async()=>{
      await must(sb.from('settings').upsert({id:1,data:s}));
      await loadAll('all');toast('تم حفظ الإعدادات');render();
    });
  },
  async appt(f){
    const id=fv(f,'id'),first=fv(f,'first').trim(),last=fv(f,'last').trim(),phone=fv(f,'phone').trim(),worker=fv(f,'worker');
    if(!first||!last){toast('أدخل اسم المريض ولقبه','err');return}
    if(phone.replace(/\D/g,'').length<8){toast('رقم الهاتف غير صالح','err');return}
    if(!worker){toast('اختر الممارس','err');return}
    const at=new Date(fv(f,'date')+'T'+fv(f,'time'));
    if(isNaN(at.getTime())){toast('حدّد التاريخ والساعة','err');return}
    const clash=db.appointments.find(x=>x.id!==id&&x.workerId===worker&&x.status==='scheduled'&&x.at===at.getTime());
    if(clash){toast('للممارس موعد آخر في الوقت نفسه','err');return}
    const row={appt_at:at.toISOString(),first_name:first,last_name:last,phone,worker_id:worker,service_note:fv(f,'service').trim(),notes:fv(f,'notes').trim()};
    await withBusy(async()=>{
      if(id)await must(sb.from('appointments').update(row).eq('id',id));
      else await must(sb.from('appointments').insert(row));
      closeModal();await loadAll('live');toast('تم حفظ الموعد');render();
    });
  },
  async pw(f){
    const a=fv(f,'p1'),b=fv(f,'p2');
    if(a.length<8){toast('كلمة المرور 8 أحرف على الأقل','err');return}
    if(a!==b){toast('كلمتا المرور غير متطابقتين','err');return}
    await withBusy(async()=>{
      const r=await sb.auth.updateUser({password:a});
      if(r.error)throw r.error;
      closeModal();toast('تم تغيير كلمة المرور');
    });
  }
};

/* ============ Events ============ */
const LIVE=['dashboard','queue','myqueue','myearnings','history','payroll','appointments','myappts','inventory'];
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const h=acts[t.dataset.act];if(h){e.preventDefault();h(t,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  e.preventDefault();const h=forms[f.dataset.form];if(h)h(f);
});
document.addEventListener('input',e=>{
  if(e.target.closest('#regForm'))updateRegSummary();
  const on=e.target.dataset&&e.target.dataset.on;
  if(on==='histQ'){ui.histQ=e.target.value;$('#histBody').innerHTML=histRows()}
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.closest('#regForm');
  if(f){
    if(t.classList.contains('mini')){const cb=t.closest('.svc')&&t.closest('.svc').querySelector('input[type=checkbox]');if(cb&&!cb.checked)cb.checked=true}
    updateRegSummary();
  }
  const on=t.dataset&&t.dataset.on;
  if(on==='histDate'){ui.histDate=t.value;$('#histBody').innerHTML=histRows()}
  if(on==='invLog'){ui.invLog=t.value;render()}
  if(on==='weekDate'&&t.value){ui.weekRef=t.value;render()}
  if(on==='svcType'){
    const range=t.value==='range';$('#rangeBox').classList.toggle('hidden',!range);$('#priceHint').textContent=range?'الافتراضي':'';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal()});
window.addEventListener('online',()=>{online=true;if(session.profile){refreshLive();render()}});
window.addEventListener('offline',()=>{online=false;if(session.profile)render()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshLive()});
setInterval(()=>{if(document.visibilityState==='visible')refreshLive()},30000);

/* ============ Start ============ */
(function setIcons(){
  [['icon','image/jpeg'],['apple-touch-icon',null]].forEach(([rel,type])=>{
    const l=document.createElement('link');l.rel=rel;if(type)l.type=type;l.href=LOGO_SRC;document.head.appendChild(l);
  });
})();
const splash=msg=>`<div class="login-wrap"><div class="login-card" style="text-align:center">${logoImg('login-logo',180)}<p class="muted">${msg}</p></div></div>`;
async function boot(){
  $('#app').innerHTML=splash('جارٍ التحميل…');
  if(!sb){$('#app').innerHTML=splash('تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم أعد تحميل الصفحة.');return}
  sb.auth.onAuthStateChange(ev=>{
    if(ev==='SIGNED_OUT'&&session.profile)setTimeout(()=>{clearSession();render()},0);
  });
  try{
    const r=await sb.auth.getSession();
    if(r.data&&r.data.session)await startSession(r.data.session.user);
  }catch(e){}
  render();
}
boot();

})();
</script>
